name: CI

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'feat/**'
      - 'chore/**'
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test

  publish:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: [unit-tests]
    if: startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Determine image tags
        id: tags
        run: |
          IMAGE="ghcr.io/joelmanasdbarrio/invobid-spa"
          if [[ "$GITHUB_REF" == refs/heads/release/* ]]; then
            BASE_VERSION="${GITHUB_REF#refs/heads/release/}"
            echo "tags=${IMAGE}:${BASE_VERSION}-rc.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          else
            VERSION="${GITHUB_REF_NAME}"
            echo "tags=${IMAGE}:${VERSION},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VITE_BASE_URL=/api/v1
            VITE_SOCKET_URL=${{ vars.VITE_SOCKET_URL }}
            VITE_APP_NAME=!nvobid
            VITE_EXT_RATING_PROVIDER=Einforma
            VITE_SMALLEST_BID_INCREMENT_PERCENTAGE=0.1

