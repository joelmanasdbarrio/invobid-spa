  publish:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    #needs: [unit-tests, react-doctor, determine-env]
    needs: [unit-tests, determine-env]
    if: startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/v')
    environment: ${{ needs.determine-env.outputs.environment }}
    outputs:
      image_tags: ${{ steps.tags.outputs.tags }}

    steps:
      - uses: actions/checkout@v4

      - name: Determine image tags
        id: tags
        run: |
          IMAGE="ghcr.io/joelmanasdbarrio/invobid-spa"
          if [[ "$GITHUB_REF" == refs/heads/release/* ]]; then
            BASE_VERSION="${GITHUB_REF#refs/heads/release/}"
            echo "tags=${IMAGE}:${BASE_VERSION}-rc.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          else
            VERSION="${GITHUB_REF_NAME}"
            echo "tags=${IMAGE}:${VERSION},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VITE_APP_NAME=${{ vars.VITE_APP_NAME }}
            VITE_BASE_URL=${{ vars.VITE_BASE_URL }}
            VITE_SOCKET_URL=${{ vars.VITE_SOCKET_URL }}
            VITE_EXT_RATING_PROVIDER=${{ vars.VITE_EXT_RATING_PROVIDER }}
            VITE_SMALLEST_BID_INCREMENT_PERCENTAGE=${{ vars.VITE_SMALLEST_BID_INCREMENT_PERCENTAGE }}
            VITE_AUCTION_EXTENSION_MINUTES=${{ vars.VITE_AUCTION_EXTENSION_MINUTES }}
            VITE_MINIMUM_INVOICE_DISCOUNT=${{ vars.VITE_MINIMUM_INVOICE_DISCOUNT }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [publish, determine-env]
    if: startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/v')
    environment: ${{ needs.determine-env.outputs.environment }}
    steps:
      - name: Extract SPA tag
        id: extract_tag
        run: |
          TAGS="${{ needs.publish.outputs.image_tags }}"
          echo "TAGS='${TAGS}'"
          if [ -z "${TAGS}" ]; then
            echo "No image tags received from publish job" >&2
            exit 1
          fi
          FIRST_ENTRY="${TAGS%%,*}"
          SPA_TAG="${FIRST_ENTRY##*:}"
          echo "spa_tag=$SPA_TAG" >> "$GITHUB_OUTPUT"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            cd ~/docker
            export SPA_TAG='${{ steps.extract_tag.outputs.spa_tag }}'
            echo "Using SPA_TAG=${SPA_TAG}"
            docker compose -f docker-compose.prod.yml pull web
            docker compose -f docker-compose.prod.yml up -d --no-deps web

      - name: Remove unused Docker images
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: docker image prune -af
